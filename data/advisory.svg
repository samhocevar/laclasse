      <text
         xml:space="preserve"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;text-align:center;writing-mode:lr-tb;text-anchor:middle;display:inline;fill:#ffffff;fill-opacity:1;stroke:none;stroke-width:1.77778pt;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"
         x="1071.7803"
         y="194.56522"
         id="text7"
         transform="scale(0.89451423,1.1179252)"><tspan
           sodipodi:role="line"
           x="1071.7803"
           y="194.56522"
           style="font-size:42.6667px;line-height:1.25;stroke-width:1.77778pt"
           id="tspan3">L’œuvre qui suit présente certains comportements et stéréotypes qui étaient</tspan><tspan
           style="font-size:42.6667px;line-height:1.25;stroke-width:1.77778pt"
           sodipodi:role="line"
           id="tspan42"
           x="1071.7803"
           y="247.89859">injustifiables à l'époque de sa création et le sont toujours aujourd'hui.</tspan></text>
      <text
         xml:space="preserve"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;text-align:center;writing-mode:lr-tb;text-anchor:middle;display:inline;fill:#ffffff;fill-opacity:1;stroke:none;stroke-width:1.77778pt;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"
         x="1071.7803"
         y="319.79721"
         id="text47"
         transform="scale(0.89451423,1.1179252)"><tspan
           style="font-size:42.6667px;line-height:1.25;stroke-width:1.77778pt"
           sodipodi:role="line"
           id="tspan46"
           x="1071.7803"
           y="319.79721">Les dialogues sont diffusés dans leur version d’origine afin de ne pas effacer</tspan><tspan
           style="font-size:42.6667px;line-height:1.25;stroke-width:1.77778pt"
           sodipodi:role="line"
           id="tspan47"
           x="1078.5216"
           y="373.13058">l'histoire, mais ils ne reflètent en aucun cas nos valeurs de respect et d’inclusion. </tspan></text>
    </g>
    <g
       id="g2"
       transform="translate(0.83843698,-80.417857)"
       style="display:inline">
      <text
         xml:space="preserve"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;text-align:center;writing-mode:lr-tb;text-anchor:middle;display:inline;fill:#ffffff;fill-opacity:1;stroke:none;stroke-width:1.77778pt;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"
         x="1071.7803"
         y="498.7001"
         id="text53"
         transform="scale(0.89451423,1.1179252)"><tspan
           style="font-style:italic;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;-inkscape-font-specification:'Optima Italic';stroke-width:1.77778pt"
           sodipodi:role="line"
           id="tspan53"
           x="1071.7803"
           y="498.7001">The following work depicts behaviours and stereotypes that were</tspan><tspan
           style="font-style:italic;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;-inkscape-font-specification:'Optima Italic';stroke-width:1.77778pt"
           sodipodi:role="line"
           x="1071.7803"
           y="553.60242"
           id="tspan60">unjustifiable at the time of its creation and remain so today.</tspan></text>
      <text
         xml:space="preserve"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;text-align:center;writing-mode:lr-tb;text-anchor:middle;display:inline;fill:#ffffff;fill-opacity:1;stroke:none;stroke-width:1.77778pt;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"
         x="1071.7803"
         y="623.93195"
         id="text55"
         transform="scale(0.89451423,1.1179252)"><tspan
           style="font-style:italic;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;-inkscape-font-specification:'Optima Italic';stroke-width:1.77778pt"
           sodipodi:role="line"
           id="tspan55"
           x="1071.7803"
           y="623.93195">The dialogue is presented in its unaltered form so as not to erase history,</tspan><tspan
           style="font-style:italic;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:42.6667px;line-height:1.25;font-family:Optima;-inkscape-font-specification:'Optima Italic';stroke-width:1.77778pt"
           sodipodi:role="line"
           x="1071.7803"
           y="678.83423"
           id="tspan59">though in no way does it reflect our values of respect and inclusion.</tspan></text>
