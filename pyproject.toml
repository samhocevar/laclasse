[project]
name = "ouiche"
version = "0.1.0"
description = "Ouiche"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "click-log", # colour logging
    "opencv-python", # most of our image processing routines
    "ffmpy", # not really using that for now
    "pillow", # somemetimes more convenient than cv2 for image processing
    "platformdirs",
]

[tool.setuptools]
packages = ['ouiche']

[project.scripts]
ouiche = "ouiche.ouiche:cli"
